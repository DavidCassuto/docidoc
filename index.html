<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E0F13">
<link rel="manifest" href="manifest.json">
<title>Docidoc</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans','Segoe UI',sans-serif;background:#0E0F13;min-height:100vh;color:#fff;}
#app{max-width:430px;margin:0 auto;min-height:100vh;}

/* HEADER */
.header{padding:52px 20px 8px;display:flex;align-items:center;justify-content:space-between;}


.header-right{display:flex;gap:10px;align-items:center;}
.add-btn{width:46px;height:46px;border-radius:50%;background:#fff;border:none;color:#0E0F13;font-size:28px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:300;flex-shrink:0;}
.back-btn{background:none;border:none;color:#aaa;font-size:32px;cursor:pointer;line-height:1;padding:0;}
.cat-header-title{font-size:20px;font-weight:900;letter-spacing:-0.5px;flex:1;}

/* SECTION LABEL */
.section-label{font-size:11px;font-weight:700;color:#444;letter-spacing:2px;text-transform:uppercase;padding:14px 20px 8px;}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:4px 16px 120px;}

/* DOC TILE */
.tile{border-radius:18px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1/1;transition:transform 0.13s;border:1px solid rgba(255,255,255,0.07);}
.tile:active{transform:scale(0.96);}
.tile-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.tile-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.tile-fallback-icon{font-size:40px;}
.tile-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,rgba(0,0,0,0.8) 100%);}
.tile-name{position:absolute;bottom:11px;left:11px;right:42px;color:#fff;font-weight:800;font-size:14px;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,0.8);}
.tile-del{position:absolute;top:9px;right:9px;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);border:none;color:rgba(255,255,255,0.85);width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}

/* SELECT MODE overlay on tile */
.tile-check{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.tile-check-bg{position:absolute;inset:0;background:rgba(0,0,0,0.35);border-radius:18px;}
.check-circle{width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:transparent;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;position:relative;z-index:1;transition:background 0.15s;}
.check-circle.checked{background:#fff;color:#111;}

/* CATEGORY TILE */
.cat-tile{border-radius:18px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1/1;transition:transform 0.13s;border:1px solid rgba(255,255,255,0.07);}
.cat-tile:active{transform:scale(0.96);}
.cat-collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;}
.cat-collage-cell{overflow:hidden;position:relative;}
.cat-collage-cell img{width:100%;height:100%;object-fit:cover;display:block;}
.cat-collage-cell.empty{background:#1e2028;}
.cat-tile-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.1) 30%,rgba(0,0,0,0.85) 100%);}
.cat-tile-footer{position:absolute;bottom:0;left:0;right:0;padding:10px 11px 11px;}
.cat-tile-name{color:#fff;font-weight:900;font-size:15px;line-height:1.2;margin-bottom:2px;}
.cat-tile-count{color:rgba(255,255,255,0.6);font-size:11px;font-weight:600;}
.cat-tile-del{position:absolute;top:9px;right:9px;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);border:none;color:rgba(255,255,255,0.85);width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.cat-tile-icon{position:absolute;top:11px;left:11px;font-size:20px;}

/* EMPTY STATE */
.empty-state{grid-column:1/-1;text-align:center;padding:60px 32px;}
.empty-state .big{font-size:52px;margin-bottom:14px;}
.empty-state p{font-size:15px;font-weight:600;color:#444;line-height:1.5;}

/* ADD MENU */
.add-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.add-menu{background:#16181F;border-radius:24px 24px 0 0;padding:20px 20px 48px;width:100%;max-width:430px;}
.add-menu-title{font-size:13px;font-weight:700;color:#444;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;text-align:center;}
.add-menu-btn{width:100%;background:#1E2028;border:1px solid #2a2d38;border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;margin-bottom:10px;transition:background 0.1s;}
.add-menu-btn:active{background:#2a2d38;}
.add-menu-icon{font-size:28px;flex-shrink:0;}
.add-menu-label{font-size:17px;font-weight:800;color:#fff;}
.add-menu-sub{font-size:12px;color:#555;margin-top:2px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:400;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#16181F;border-radius:26px 26px 0 0;padding:28px 22px 52px;width:100%;max-width:430px;}
.modal h2{font-size:22px;font-weight:900;margin-bottom:22px;letter-spacing:-0.5px;}
.field-label{font-size:12px;font-weight:700;color:#555;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.name-input{width:100%;background:#1E2028;border:1.5px solid #2a2d38;border-radius:14px;color:#fff;font-size:17px;padding:15px 16px;outline:none;font-family:inherit;margin-bottom:20px;}
.name-input:focus{border-color:#555;}
.file-pick-area{border:2px dashed #2a2d38;border-radius:16px;padding:22px;text-align:center;cursor:pointer;margin-bottom:24px;transition:border-color 0.2s;}
.file-pick-area.has-file{border-color:#3a6;}
.file-pick-label{font-size:15px;font-weight:700;color:#555;}
.file-pick-area.has-file .file-pick-label{color:#3a6;}
.file-pick-hint{font-size:12px;color:#444;margin-top:5px;}
.primary-btn{width:100%;border:none;border-radius:16px;padding:17px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;background:#fff;color:#111;}
.primary-btn:disabled{opacity:0.6;}
.cancel-btn{width:100%;background:none;color:#555;border:none;padding:14px;font-size:15px;cursor:pointer;margin-top:8px;font-family:inherit;}

/* SELECT DOCS SCREEN */
.select-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#16181F;border-top:1px solid #2a2d38;padding:16px 20px 36px;z-index:50;display:flex;gap:12px;align-items:center;}
.select-count{flex:1;font-size:15px;font-weight:700;color:#aaa;}
.select-confirm-btn{background:#fff;color:#111;border:none;border-radius:14px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}

/* VIEWER */
.viewer{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;}
.viewer-bar{background:rgba(14,15,19,0.97);padding:50px 16px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:1;}
.viewer-back{background:none;border:none;color:#aaa;font-size:34px;cursor:pointer;line-height:1;padding:0 4px 0 0;flex-shrink:0;}
.viewer-title{color:#fff;font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit;}
.viewer-hint{font-size:11px;color:#444;white-space:nowrap;flex-shrink:0;}
.share-btn{background:#1a1d24;border:1px solid #2e3140;border-radius:50%;width:40px;height:40px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.img-stage{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111;position:relative;touch-action:none;}
.zoomable{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-select:none;pointer-events:none;}
.viewer-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#111;}
.viewer-body iframe{width:100%;height:100%;border:none;}
.viewer-fallback{text-align:center;padding:48px 24px;}
.viewer-fallback .fi{font-size:60px;}
.viewer-fallback p{color:#ccc;font-weight:600;margin:18px 0 28px;word-break:break-all;line-height:1.4;}
.dl-btn{display:inline-block;background:#fff;color:#111;border-radius:14px;padding:14px 32px;font-weight:800;text-decoration:none;font-size:15px;font-family:inherit;}

/* CONFIRM */
.confirm-wrap{position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;justify-content:center;}
.confirm-bg{position:absolute;inset:0;background:rgba(0,0,0,0.75);}
.confirm-box{position:relative;background:#16181F;border-radius:22px 22px 0 0;padding:28px 22px 48px;width:100%;max-width:430px;}
.confirm-box p{font-size:16px;font-weight:700;text-align:center;margin-bottom:22px;color:#eee;line-height:1.4;}
.confirm-row{display:flex;gap:12px;}
.btn-yes{flex:1;background:#C0392B;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn-no{flex:1;background:#22252E;color:#aaa;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}

/* SHARE PANEL */
.share-panel-overlay{position:fixed;inset:0;z-index:600;display:flex;align-items:flex-end;justify-content:center;}
.share-panel-bg{position:absolute;inset:0;background:rgba(0,0,0,0.75);}
.share-panel-box{position:relative;background:#16181F;border-radius:24px 24px 0 0;padding:26px 22px 48px;width:100%;max-width:430px;overflow-y:auto;max-height:90vh;}

/* TOAST */
.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:50px;padding:11px 26px;font-size:14px;font-weight:800;z-index:700;white-space:nowrap;box-shadow:0 6px 28px rgba(0,0,0,0.45);pointer-events:none;animation:toastIn 0.2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,0.15);border-top-color:#111;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Sound Engine ──────────────────────────────────────────────
const SFX=(()=>{
  let ctx=null;
  function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx;}
  function tone(freq,type,vol,start,dur,endFreq){const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);if(endFreq!==undefined)o.frequency.linearRampToValueAtTime(endFreq,c.currentTime+start+dur);g.gain.setValueAtTime(0,c.currentTime+start);g.gain.linearRampToValueAtTime(vol,c.currentTime+start+0.01);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+start+dur);o.start(c.currentTime+start);o.stop(c.currentTime+start+dur+0.05);}
  function noise(vol,start,dur){const c=ac(),buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1);const src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=0.5;src.buffer=buf;src.connect(f);f.connect(g);g.connect(c.destination);g.gain.setValueAtTime(vol,c.currentTime+start);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+start+dur);src.start(c.currentTime+start);src.stop(c.currentTime+start+dur+0.05);}
  return{
    tap(){tone(420,'sine',0.18,0,0.08);tone(320,'sine',0.08,0.04,0.08);},
    open(){tone(180,'sine',0.12,0,0.18,440);tone(220,'sine',0.06,0.05,0.18,520);},
    close(){tone(400,'sine',0.10,0,0.15,180);tone(300,'sine',0.05,0.03,0.12,140);},
    save(){tone(523,'sine',0.14,0,0.12);tone(659,'sine',0.14,0.10,0.12);tone(784,'sine',0.18,0.20,0.22);},
    share(){tone(300,'sine',0.10,0,0.08,600);tone(600,'sine',0.12,0.06,0.14,900);noise(0.04,0.10,0.10);},
    delete(){tone(120,'sine',0.20,0,0.15,60);tone(80,'triangle',0.15,0.02,0.18);noise(0.06,0,0.12);},
    click(){tone(600,'sine',0.10,0,0.06);tone(400,'sine',0.05,0.03,0.06);},
  };
})();

const PAL=[
  {bg:'#B22222',dk:'#7B1212'},{bg:'#1A5276',dk:'#0D2E45'},
  {bg:'#1D6A3A',dk:'#0F3D20'},{bg:'#6C3483',dk:'#3D1A4D'},
  {bg:'#B94A00',dk:'#7A3000'},{bg:'#0E7490',dk:'#084F63'},
  {bg:'#374151',dk:'#1F2937'},{bg:'#92610A',dk:'#5C3D06'},
];

// ── IndexedDB ─────────────────────────────────────────────────
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('docvault5',1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs',{keyPath:'id'});
      if(!d.objectStoreNames.contains('cats')) d.createObjectStore('cats',{keyPath:'id'});
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=()=>rej(r.error);
  });
}
function dbAll(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbPut(store,o){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function dbDel(store,id){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

// ── State ─────────────────────────────────────────────────────
let docs=[], cats=[], activeCat=null, selectMode=null; // selectMode = {catName, selected: Set}

function uid(){return 'D'+Date.now()+Math.random().toString(36).slice(2);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
function uncategorized(){return docs.filter(d=>!d.catId);}
function docsInCat(catId){return docs.filter(d=>d.catId===catId);}
function palFor(idx){return PAL[idx%PAL.length];}

// ── Thumbnails ────────────────────────────────────────────────
function imgThumb(dataUrl){return new Promise(res=>{const img=new Image();img.onload=()=>{const MAX=500,ratio=Math.min(MAX/img.width,MAX/img.height,1);const c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8));};img.onerror=()=>res(null);img.src=dataUrl;});}
async function pdfThumb(dataUrl){if(!window.pdfjsLib)return null;try{const pdf=await pdfjsLib.getDocument(dataUrl).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:0.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',0.8);}catch{return null;}}

// ── Render ────────────────────────────────────────────────────
function render(){
  const content=document.getElementById('mainContent');
  const header=document.getElementById('mainHeader');

  // Remove select bar if present
  document.getElementById('selectBar')?.remove();

  if(activeCat){
    // Category view header
    header.innerHTML=`
      <button class="back-btn" id="backBtn">‹</button>
      <div class="cat-header-title">${esc(activeCat.name)}</div>
      <div class="header-right"><button class="add-btn" id="addBtn">+</button></div>`;
    header.querySelector('#backBtn').addEventListener('click',()=>{SFX.close();activeCat=null;render();});
    header.querySelector('#addBtn').addEventListener('click',()=>showAddMenu());

    const catDocs=docsInCat(activeCat.id);
    content.innerHTML='';
    if(!catDocs.length){
      content.innerHTML='<div class="grid"><div class="empty-state"><div class="big">📂</div><p>No documents yet.<br>Tap <strong>+</strong> to add one.</p></div></div>';
    } else {
      const grid=document.createElement('div');grid.className='grid';
      catDocs.forEach(doc=>grid.appendChild(makeDocTile(doc)));
      content.appendChild(grid);
    }
    return;
  }

  // Main view header
  header.innerHTML=`
    <div class="logo">Docidoc</div>
    <div class="header-right"><button class="add-btn" id="addBtn">+</button></div>`;
  header.querySelector('#addBtn').addEventListener('click',()=>showAddMenu());

  content.innerHTML='';

  if(selectMode){
    // Selection mode — show all uncategorized docs with checkboxes
    const instr=document.createElement('div');
    instr.style.cssText='padding:8px 20px 4px;font-size:13px;color:#666;font-weight:600;';
    instr.textContent='Tap documents to add to "'+selectMode.catName+'"';
    content.appendChild(instr);

    const grid=document.createElement('div');grid.className='grid';
    const pool=uncategorized();
    if(!pool.length){
      grid.innerHTML='<div class="empty-state" style="padding:40px 0"><p style="color:#555">No uncategorized documents available.</p></div>';
    } else {
      pool.forEach(doc=>{
        const tile=makeDocTile(doc,true);
        grid.appendChild(tile);
      });
    }
    content.appendChild(grid);

    // Select bar
    const bar=document.createElement('div');
    bar.className='select-bar';bar.id='selectBar';
    bar.innerHTML=`<div class="select-count" id="selectCount">0 selected</div>
      <button class="cancel-btn" style="width:auto;padding:14px 16px;margin:0;" id="cancelSelectBtn">Cancel</button>
      <button class="select-confirm-btn" id="confirmSelectBtn">Create</button>`;
    bar.querySelector('#cancelSelectBtn').addEventListener('click',()=>{SFX.close();selectMode=null;render();});
    bar.querySelector('#confirmSelectBtn').addEventListener('click',()=>confirmCreateCat());
    document.body.appendChild(bar);
    return;
  }

  // Normal main view
  const hasCats=cats.length>0;
  const hasUncategorized=uncategorized().length>0;

  if(!hasCats && !hasUncategorized){
    content.innerHTML='<div class="grid"><div class="empty-state"><div class="big">📂</div><p>No documents yet.<br>Tap <strong>+</strong> to get started.</p></div></div>';
    return;
  }

  if(hasCats){
    const label=document.createElement('div');label.className='section-label';label.textContent='Categories';
    content.appendChild(label);
    const grid=document.createElement('div');grid.className='grid';
    cats.forEach(cat=>grid.appendChild(makeCatTile(cat)));
    content.appendChild(grid);
  }

  if(hasUncategorized){
    const label=document.createElement('div');label.className='section-label';
    label.textContent=hasCats?'Other Documents':'Documents';
    content.appendChild(label);
    const grid=document.createElement('div');grid.className='grid';
    uncategorized().forEach(doc=>grid.appendChild(makeDocTile(doc)));
    content.appendChild(grid);
  }
}

// ── Make doc tile ─────────────────────────────────────────────
function makeDocTile(doc, selectable=false){
  const p=palFor(doc.palIdx||0);
  const tile=document.createElement('div');
  tile.className='tile';
  tile.dataset.id=doc.id;
  tile.innerHTML=(doc.thumb
    ?`<img class="tile-img" src="${doc.thumb}" alt="">`
    :`<div class="tile-fallback" style="background:linear-gradient(145deg,${p.bg},${p.dk})"><div class="tile-fallback-icon">📄</div></div>`
  )+`<div class="tile-overlay"></div>
     <button class="tile-del">✕</button>
     <div class="tile-name">${esc(doc.name)}</div>`;

  if(selectable){
    const isChecked=selectMode.selected.has(doc.id);
    const overlay=document.createElement('div');
    overlay.className='tile-check';
    overlay.innerHTML=`<div class="tile-check-bg"></div><div class="check-circle${isChecked?' checked':''}">${isChecked?'✓':''}</div>`;
    overlay.addEventListener('click',()=>toggleSelect(doc.id, tile));
    tile.appendChild(overlay);
    tile.querySelector('.tile-del').style.display='none';

  ov.innerHTML=`<div class="modal">

    </div>
    <input type="file" id="fileIn" accept="*/*" style="display:none">
    <button class="primary-btn" id="saveBtn">Save Document</button>
    <button class="cancel-btn" id="cancelBtn">Cancel</button>
  </div>`;
  ov.addEventListener('click',e=>{if(e.target===ov){SFX.close();ov.remove();}});
  ov.querySelector('#cancelBtn').addEventListener('click',()=>{SFX.close();ov.remove();});
  const pickArea=ov.querySelector('#pickArea'),pickLabel=ov.querySelector('#pickLabel'),fileIn=ov.querySelector('#fileIn');
  pickArea.addEventListener('click',()=>fileIn.click());
  fileIn.addEventListener('change',()=>{

    pendingFile=f;pickLabel.textContent='✅ '+f.name;pickArea.classList.add('has-file');
    const ni=ov.querySelector('#docName');if(!ni.value.trim())ni.value=f.name.replace(/\.[^/.]+$/,'');
  });
  ov.querySelector('#saveBtn').addEventListener('click',async()=>{
    const name=ov.querySelector('#docName').value.trim();
    if(!name){ov.querySelector('#docName').focus();return;}
    if(!pendingFile){ov.querySelector('#pickArea').style.borderColor='#c0392b';return;}
    const btn=ov.querySelector('#saveBtn');btn.innerHTML='<span class="spinner"></span>Saving…';btn.disabled=true;
    try{
      const data=await readFile(pendingFile);
      let thumb=null;
      if(pendingFile.type.startsWith('image/'))thumb=await imgThumb(data);
      else if(pendingFile.type==='application/pdf')thumb=await pdfThumb(data);
      const catId=activeCat?activeCat.id:undefined;
      const doc={id:uid(),name,type:pendingFile.type,size:pendingFile.size,data,thumb,palIdx:nextPal,catId,createdAt:Date.now()};
      await dbPut('docs',doc);docs.push(doc);
      render();ov.remove();SFX.save();toast(`"${name}" added`);

  });
  document.body.appendChild(ov);
  setTimeout(()=>ov.querySelector('#docName').focus(),80);

function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});}

function addPinchZoom(img,stage){
  let scale=1,tx=0,ty=0,startScale=1,startTx=0,startTy=0,startDist=0,startMidX=0,startMidY=0,lastX=0,lastY=0,lastTap=0;
  function dist(a,b){const dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;return Math.sqrt(dx*dx+dy*dy);}
  function mid(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};}
  function apply(){img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
  function reset(){scale=1;tx=0;ty=0;apply();}
  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===2){e.preventDefault();startDist=dist(e.touches[0],e.touches[1]);startScale=scale;startTx=tx;startTy=ty;const m=mid(e.touches[0],e.touches[1]);startMidX=m.x;startMidY=m.y;}
    else if(e.touches.length===1){lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;const now=Date.now();if(now-lastTap<280)reset();lastTap=now;}
  },{passive:false});
  stage.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===2){const d=dist(e.touches[0],e.touches[1]);scale=Math.min(Math.max(startScale*(d/startDist),1),6);const m=mid(e.touches[0],e.touches[1]);tx=startTx+(m.x-startMidX);ty=startTy+(m.y-startMidY);apply();}
    else if(e.touches.length===1&&scale>1){tx+=e.touches[0].clientX-lastX;ty+=e.touches[0].clientY-lastY;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;apply();}
  },{passive:false});
  stage.addEventListener('touchend',()=>{if(scale<1.05)reset();},{passive:true});
}

// ── Share ─────────────────────────────────────────────────────
function dataUrlToBlob(dataUrl){
  try{const parts=dataUrl.split(','),mime=parts[0].match(/:(.*?);/)[1],binary=atob(parts[1]),buf=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)buf[i]=binary.charCodeAt(i);return new Blob([buf],{type:mime});}catch{return null;}
}

async function shareDoc(doc){
  try{
    const blob=dataUrlToBlob(doc.data);
    if(!blob)throw new Error('no blob');
    const file=new File([blob],doc.name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:doc.name});
      SFX.share();return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=doc.name;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);
    SFX.share();
    showSharePanel(doc.name);
  }catch(err){
    if(err.name==='AbortError')return;
    const blob=dataUrlToBlob(doc.data);
    if(blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=doc.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);}
    SFX.share();
    showSharePanel(doc.name);
  }
}

// ── Boot ──────────────────────────────────────────────────────
async function init(){
  if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();
  db=await openDB();
  // Try to migrate existing docs from old DB
  try{
    const oldReq=indexedDB.open('docvault4',1);
    await new Promise(res=>{
      oldReq.onsuccess=async e=>{
        const oldDb=e.target.result;
        if(oldDb.objectStoreNames.contains('docs')){
          const oldDocs=await new Promise(r2=>{const q=oldDb.transaction('docs').objectStore('docs').getAll();q.onsuccess=()=>r2(q.result);q.onerror=()=>r2([]);});
          for(const d of oldDocs) await dbPut('docs',d);
        }
        oldDb.close();res();
      };
      oldReq.onerror=()=>res();
      oldReq.onblocked=()=>res();
    });
  }catch{}
  docs=await dbAll('docs');
  cats=await dbAll('cats');
  docs.sort((a,b)=>a.createdAt-b.createdAt);
  cats.sort((a,b)=>a.createdAt-b.createdAt);
  render();
}
init().catch(console.error);

// ── PWA Install Prompt ────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
  deferredPrompt = null;
});

function installApp() {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
}
